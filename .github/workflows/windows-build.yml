name: Windows build

## Exports the game as a Windows binary, runs the exported build headlessly
## under Wine to prove it boots, and only then publishes it as a download.
##
## The 4.3 export templates are the one thing the project needs that cannot be
## generated from source: they are fetched from the same Godot release as the
## editor. The preset in export_presets.cfg embeds the game data inside the .exe
## (binary_format/embed_pck), so the download is one self-contained executable.
## It needs no ANGLE libraries because the project pins the compatibility
## renderer to the native Windows OpenGL driver (see rendering/gl_compatibility/
## driver.windows in project.godot).

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Export the Windows build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Download Godot 4.3
        run: |
          curl -sSL -o godot.zip https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q godot.zip
          mv Godot_v4.3-stable_linux.x86_64 godot
          chmod +x godot
          ./godot --version

      - name: Download the 4.3 export templates
        run: |
          curl -sSL -o templates.tpz https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable"
          unzip -q templates.tpz -d /tmp/templates
          mv /tmp/templates/templates/* "$HOME/.local/share/godot/export_templates/4.3.stable/"
          ls "$HOME/.local/share/godot/export_templates/4.3.stable/" | grep -i windows

      - name: Import the project
        run: ./godot --headless --path . --import

      - name: Export the release build
        run: |
          mkdir -p build
          ./godot --headless --path . --export-release "Windows Desktop" build/TwoKeepers.exe
          echo "--- exported files ---"
          ls -la build
          test -f build/TwoKeepers.exe
          # The .pck is embedded in the executable, so a real build is tens of
          # megabytes; a few hundred kilobytes would mean an empty export that
          # would otherwise ship silently.
          size=$(stat -c%s build/TwoKeepers.exe)
          echo "TwoKeepers.exe is $size bytes"
          if [ "$size" -lt 10000000 ]; then
            echo "::error::the exported executable is only $size bytes - the game data was not embedded"
            exit 1
          fi
          cp tools/HOW-TO-RUN.txt build/HOW-TO-RUN.txt

      - name: Package the download
        run: |
          (cd build && zip -r ../TwoKeepers-Windows.zip .)
          ls -la TwoKeepers-Windows.zip
          unzip -l TwoKeepers-Windows.zip
          # A notice annotation, so the file list of the shipped build is
          # readable straight from the run's summary page.
          echo "::notice::TwoKeepers-Windows.zip contains: $(cd build && ls -1 | tr '\n' ' ') ($(stat -c%s TwoKeepers-Windows.zip) bytes)"

      - name: Upload the build
        uses: actions/upload-artifact@v4
        with:
          name: TwoKeepers-Windows
          path: TwoKeepers-Windows.zip
          if-no-files-found: error

  wine-check:
    name: Boot the exported build
    needs: windows
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Download the packaged build
        uses: actions/download-artifact@v4
        with:
          name: TwoKeepers-Windows
          path: dist

      - name: Unpack it exactly as a player would
        run: |
          cd dist
          unzip -q TwoKeepers-Windows.zip
          ls -la

      - name: Install Wine
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends wine64 || sudo apt-get install -y -qq --no-install-recommends wine
          command -v wine64 || command -v wine

      - name: Run the game headless and read its log
        run: |
          WINE_BIN=$(command -v wine64 || command -v wine)
          export WINEDEBUG=-all
          export WINEPREFIX="$PWD/.wineprefix"
          status=0
          (cd dist && "$WINE_BIN" TwoKeepers.exe --headless --quit-after 240 -- --level=0) > wine.log 2>&1 || status=$?
          echo "--- exit status $status ---"
          head -n 40 wine.log
          banner=$(grep -c "Godot Engine v4.3" wine.log || true)
          errors=$(grep -cE "ERROR:|SCRIPT ERROR|Failed to load|Cannot open" wine.log || true)
          echo "engine banner lines: $banner, error lines: $errors"
          if [ "$banner" -eq 0 ]; then
            echo "::error::the exported build never reached the engine banner - it did not start"
            exit 1
          fi
          if [ "$errors" -ne 0 ]; then
            grep -E "ERROR:|SCRIPT ERROR|Failed to load|Cannot open" wine.log | sort | uniq -c | sort -rn | head -n 5 | sed 's/%/%25/g; s/\r//g' | while IFS= read -r line; do echo "::error::exported build: $line"; done
            exit 1
          fi
          if [ "$status" -ne 0 ]; then
            echo "::error::the exported build exited with status $status"
            exit 1
          fi
          echo "::notice::the exported TwoKeepers.exe started, ran garden 1 for 240 frames and exited cleanly"

  publish:
    name: Publish the download
    needs: [windows, wine-check]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download the verified build
        uses: actions/download-artifact@v4
        with:
          name: TwoKeepers-Windows

      - name: Publish or refresh the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view windows-build >/dev/null 2>&1 && gh release delete windows-build --yes --cleanup-tag || true
          gh release create windows-build TwoKeepers-Windows.zip \
            --title "Two Keepers - Gardens of Cyrus (Windows build)" \
            --notes "Unzip TwoKeepers-Windows.zip and run TwoKeepers.exe: one self-contained file, nothing else to install. Two players at one keyboard - keeper 1 uses A/D, Space, S and F; keeper 2 uses the arrow keys, Z, X and C. The zip also contains HOW-TO-RUN.txt. Built automatically from commit $GITHUB_SHA, and smoke-run headlessly before it is published."
