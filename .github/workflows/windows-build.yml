name: Windows build

## Exports the game as a Windows binary, boots the exported pack headlessly to
## prove the shipped data is complete, and only then publishes the download.
##
## The 4.3 export templates are the one thing the project needs that cannot be
## generated from source: they are fetched from the same Godot release as the
## editor. The preset in export_presets.cfg embeds the game data inside the .exe
## (binary_format/embed_pck), so the download is one self-contained executable.
## It needs no ANGLE libraries because the project pins the compatibility
## renderer to the native Windows OpenGL driver (see rendering/gl_compatibility/
## driver.windows in project.godot).

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Export the Windows build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Download Godot 4.3
        run: |
          curl -sSL -o godot.zip https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q godot.zip
          mv Godot_v4.3-stable_linux.x86_64 godot
          chmod +x godot
          ./godot --version

      - name: Download the 4.3 export templates
        run: |
          curl -sSL -o templates.tpz https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable"
          unzip -q templates.tpz -d /tmp/templates
          mv /tmp/templates/templates/* "$HOME/.local/share/godot/export_templates/4.3.stable/"
          ls "$HOME/.local/share/godot/export_templates/4.3.stable/" | grep -i windows

      - name: Import the project
        run: ./godot --headless --path . --import

      - name: Export the release build
        run: |
          mkdir -p build
          ./godot --headless --path . --export-release "Windows Desktop" build/TwoKeepers.exe
          echo "--- exported files ---"
          ls -la build
          test -f build/TwoKeepers.exe
          # The .pck is embedded in the executable, so a real build is tens of
          # megabytes; a few hundred kilobytes would mean an empty export that
          # would otherwise ship silently.
          size=$(stat -c%s build/TwoKeepers.exe)
          echo "TwoKeepers.exe is $size bytes"
          if [ "$size" -lt 10000000 ]; then
            echo "::error::the exported executable is only $size bytes - the game data was not embedded"
            exit 1
          fi
          cp tools/HOW-TO-RUN.txt build/HOW-TO-RUN.txt

      - name: Package the download
        run: |
          (cd build && zip -r ../TwoKeepers-Windows.zip .)
          ls -la TwoKeepers-Windows.zip
          unzip -l TwoKeepers-Windows.zip
          # A notice annotation, so the file list of the shipped build is
          # readable straight from the run's summary page.
          echo "::notice::TwoKeepers-Windows.zip contains: $(cd build && ls -1 | tr '\n' ' ') ($(stat -c%s TwoKeepers-Windows.zip) bytes)"

      - name: Upload the build
        uses: actions/upload-artifact@v4
        with:
          name: TwoKeepers-Windows
          path: TwoKeepers-Windows.zip
          if-no-files-found: error

  pack-check:
    name: Boot the packaged game
    needs: windows
    runs-on: ubuntu-latest
    timeout-minutes: 20

    ## The .exe is Godot's official Windows template with our exported data
    ## embedded in it. Running the .exe itself needs Windows (or Wine, which is
    ## not reliably installable on a hosted runner), so this job verifies the
    ## part that can actually be wrong: the packaged data. It exports the same
    ## pack the .exe carries, boots it *from the pack* - no project directory,
    ## nothing but the pack - in every garden, and fails on any error line.

    steps:
      - uses: actions/checkout@v4

      - name: Download Godot 4.3
        run: |
          curl -sSL -o godot.zip https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q godot.zip
          mv Godot_v4.3-stable_linux.x86_64 godot
          chmod +x godot
          ./godot --version

      - name: Import the project
        run: ./godot --headless --path . --import

      - name: Export the pack the .exe carries
        run: |
          mkdir -p build
          ./godot --headless --path . --export-pack "Windows Desktop" build/game.pck
          test -s build/game.pck
          ls -la build/game.pck

      - name: Boot it from the pack, with no project directory in sight
        run: |
          rm -rf /tmp/run && mkdir -p /tmp/run
          cp build/game.pck /tmp/run/game.pck
          failed=0
          for i in 0 1 2 3; do
            status=0
            (cd /tmp/run && "$GITHUB_WORKSPACE/godot" --headless --main-pack game.pck --quit-after 240 -- --level=$i) > "pack_$i.log" 2>&1 || status=$?
            banner=$(grep -c "Godot Engine v4.3" "pack_$i.log" || true)
            errors=$(grep -cE "ERROR:|SCRIPT ERROR|Failed to load|Cannot open|Invalid (call|get|set|access)" "pack_$i.log" || true)
            echo "garden $i: exit $status, banner $banner, errors $errors, $(wc -l < "pack_$i.log") log lines"
            if [ "$banner" -eq 0 ] || [ "$errors" -ne 0 ] || [ "$status" -ne 0 ]; then
              failed=1
              grep -E "ERROR:|SCRIPT ERROR|Failed to load|Cannot open|Invalid (call|get|set|access)" "pack_$i.log" \
                | sort | uniq -c | sort -rn | head -n 2 | sed 's/%/%25/g; s/\r//g' \
                | while IFS= read -r line; do echo "::error::pack garden $i: $line"; done
              if [ "$banner" -eq 0 ]; then
                echo "::error::pack garden $i: the engine never reached its banner (exit $status)"
              fi
            fi
          done
          if [ "$failed" -eq 0 ]; then
            echo "::notice::the exported pack booted all four gardens from the pack alone, 240 frames each, with no error lines"
          fi
          exit "$failed"

  publish:
    name: Publish the download
    needs: [windows, pack-check]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download the verified build
        uses: actions/download-artifact@v4
        with:
          name: TwoKeepers-Windows

      - name: Publish or refresh the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view windows-build >/dev/null 2>&1 && gh release delete windows-build --yes --cleanup-tag || true
          gh release create windows-build TwoKeepers-Windows.zip \
            --title "Two Keepers - Gardens of Cyrus (Windows build)" \
            --notes "Unzip TwoKeepers-Windows.zip and run TwoKeepers.exe: one self-contained file, nothing else to install. Two players at one keyboard - keeper 1 uses A/D, Space, S and F; keeper 2 uses the arrow keys, Z, X and C. The zip also contains HOW-TO-RUN.txt. Built automatically from commit $GITHUB_SHA, and its packaged data is booted headlessly before it is published."
