name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  godot-tests:
    name: Headless suite + level design check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      GODOT: ./godot

    steps:
      - uses: actions/checkout@v4

      - name: Download Godot 4.3
        run: |
          curl -sSL -o godot.zip https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q godot.zip
          mv Godot_v4.3-stable_linux.x86_64 godot
          chmod +x godot
          ./godot --version

      - name: Import project
        run: ./godot --headless --path . --import

      - name: Every script compiles
        run: |
          # The editor scan loads the whole project with the autoloads registered,
          # so a parse or type-inference error in any script shows up here.
          ./godot --headless --path . --editor --quit > editor.log 2>&1 || true
          if grep -qE "Parse Error|Compile Error" editor.log; then
            grep -E "Parse Error|Compile Error|GDScript::reload" editor.log | head -n 120 > compile.log
            cat compile.log
            grep -E "Parse Error|Compile Error" compile.log | head -n 45 \
              | sed 's/%/%25/g; s/\r//g' \
              | while IFS= read -r line; do echo "::error::compile: $line"; done
            exit 1
          fi
          echo "every script compiles"

      - name: Behavioural test suite
        run: |
          status=0
          ./godot --headless --path . res://tests/test_runner.tscn > suite.log 2>&1 || status=$?
          tail -n 80 suite.log
          annotate() { sed 's/%/%25/g; s/\r//g' | while IFS= read -r line; do echo "::error::test suite: $line"; done; }
          if [ "$status" -ne 0 ]; then
            grep -E "FAIL|ERROR|error|Assertion|Parser|Invalid" suite.log | tail -n 40 | annotate
          fi
          exit "$status"

      - name: Level design check
        if: ${{ !cancelled() }}
        run: python3 tools/level_check.py

      - name: Smoke-run every garden
        if: ${{ !cancelled() }}
        run: |
          failed=0
          : > smoke_summary.txt
          for i in 0 1 2 3; do
            echo "--- garden $i ---"
            ./godot --headless --path . res://src/main.tscn --quit-after 240 -- --level=$i > "smoke_$i.log" 2>&1 || true
            hits=$(grep -cE "SCRIPT ERROR|ERROR:|Invalid (call|get|set|access)|Cannot" "smoke_$i.log" || true)
            echo "garden $i: $(wc -l < "smoke_$i.log") log lines, $hits of them errors"
            if [ "$hits" -gt 0 ]; then
              failed=1
              # Count the distinct errors, keeping the engine's own "at: ..."
              # location line that follows each one, so a flood of the same
              # message collapses to a single, named call site.
              awk '/ERROR:/ { msg = $0; if ((getline nxt) > 0) { if (nxt ~ /at:/) { print msg " ||" nxt } else { print msg } } }' "smoke_$i.log" \
                | sed 's/%/%25/g; s/\r//g' | sort | uniq -c | sort -rn > "smoke_$i.summary"
              head -n 4 "smoke_$i.summary"
              {
                echo "garden $i: $hits error lines"
                head -n 4 "smoke_$i.summary"
              } >> smoke_summary.txt
              # At most two annotations per garden (GitHub keeps ten per step).
              head -n 2 "smoke_$i.summary" | sed 's/^ *//' \
                | while IFS= read -r line; do echo "::error::garden $i: $line"; done
            else
              echo "garden $i ran clean"
              echo "garden $i: clean" >> smoke_summary.txt
            fi
          done
          exit "$failed"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: |
            suite.log
            smoke_*.log
            smoke_summary.txt
          if-no-files-found: ignore
