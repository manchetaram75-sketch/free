name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  godot-tests:
    name: Headless suite + level design check
    runs-on: ubuntu-latest

    env:
      GODOT: ./godot

    steps:
      - uses: actions/checkout@v4

      - name: Download Godot 4.3
        run: |
          curl -sSL -o godot.zip https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q godot.zip
          mv Godot_v4.3-stable_linux.x86_64 godot
          chmod +x godot
          ./godot --version

      - name: Import project
        run: ./godot --headless --path . --import

      - name: Every script compiles
        run: |
          # The editor scan loads the whole project with the autoloads registered,
          # so a parse or type-inference error in any script shows up here.
          ./godot --headless --path . --editor --quit > editor.log 2>&1 || true
          if grep -qE "Parse Error|Compile Error" editor.log; then
            grep -E "Parse Error|Compile Error|GDScript::reload" editor.log | head -n 120 > compile.log
            cat compile.log
            grep -E "Parse Error|Compile Error" compile.log | head -n 45 \
              | sed 's/%/%25/g; s/\r//g' \
              | while IFS= read -r line; do echo "::error::compile: $line"; done
            exit 1
          fi
          echo "every script compiles"

      - name: Behavioural test suite
        run: |
          status=0
          ./godot --headless --path . res://tests/test_runner.tscn > suite.log 2>&1 || status=$?
          tail -n 80 suite.log
          annotate() { sed 's/%/%25/g; s/\r//g' | while IFS= read -r line; do echo "::error::test suite: $line"; done; }
          if [ "$status" -ne 0 ]; then
            grep -E "FAIL|ERROR|error|Assertion|Parser|Invalid" suite.log | tail -n 40 | annotate
          fi
          exit "$status"

      - name: Level design check
        run: python3 tools/level_check.py

      - name: Smoke-run every garden
        run: |
          failed=0
          for i in 0 1 2 3; do
            echo "--- garden $i ---"
            ./godot --headless --path . res://src/main.tscn --quit-after 240 -- --level=$i > "smoke_$i.log" 2>&1 || true
            if grep -nE "SCRIPT ERROR|ERROR:|Invalid (call|get|set|access)|Cannot" "smoke_$i.log"; then
              grep -nE "SCRIPT ERROR|ERROR:|Invalid (call|get|set|access)|Cannot" "smoke_$i.log" \
                | tail -n 15 | sed 's/%/%25/g; s/\r//g' \
                | while IFS= read -r line; do echo "::error::garden $i: $line"; done
              failed=1
            else
              echo "garden $i ran clean"
            fi
          done
          exit "$failed"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: |
            suite.log
            smoke_*.log
          if-no-files-found: ignore
