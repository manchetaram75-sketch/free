name: Diagnostics

# TEMPORARY: reads the whole headless suite log back through the annotations
# API, ten lines per step (GitHub caps annotations per step). Delete once the
# suite is green.

on:
  workflow_dispatch:
  push:
    branches: [arena/01a0ba73-free]

jobs:
  log:
    name: Suite log
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Godot 4.3
        run: |
          curl -sSL -o godot.zip https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q godot.zip && mv Godot_v4.3-stable_linux.x86_64 godot && chmod +x godot

      - name: Import project
        run: ./godot --headless --path . --import > import.log 2>&1 || true

      - name: Run suite
        run: |
          ./godot --headless --path . res://tests/test_runner.tscn > suite.log 2>&1 || true
          grep -nE "DEBUG|FAIL|SCRIPT ERROR|^\[|PASS|Assertion" suite.log > interesting.log || true
          echo "suite lines: $(wc -l < suite.log), interesting: $(wc -l < interesting.log)"

      - name: Log 01 (1-10)
        run: sed -n '1,10p' interesting.log | sed 's/%/%25/g; s/\r//g' | while IFS= read -r line; do echo "::error::log ${first}: $line"; done
      - name: Log 02 (11-20)
        run: sed -n '11,20p' interesting.log | sed 's/%/%25/g; s/\r//g' | while IFS= read -r line; do echo "::error::log ${first}: $line"; done
